<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastBN Network Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%278%27 cy=%2716%27 r=%274%27 fill=%27%2358d68d%27/%3E%3Ccircle cx=%2722%27 cy=%278%27 r=%274%27 fill=%27%234cc9f0%27/%3E%3Ccircle cx=%2723%27 cy=%2724%27 r=%274%27 fill=%27%23b98bff%27/%3E%3Cpath d=%27M8 16 22 8 M8 16 23 24%27 stroke=%27%23ffd166%27 stroke-width=%272%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="vendor/cosmos.gl-3.4.1.min.js"></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>FastBN Network Viewer</h1>
      <p class="sub">cosmos.gl (GPU force graph) で推定済みネットワークを見る</p>
    </header>

    <section>
      <label class="lbl" for="network">ネットワーク</label>
      <select id="network"></select>
      <div id="netinfo" class="info"></div>
      <div id="warnings" class="warn" hidden></div>
    </section>

    <section>
      <label class="lbl" for="edgeAttr">エッジの色・太さ</label>
      <select id="edgeAttr"></select>
      <div class="lbl row">
        <span>表示するエッジ</span>
        <span class="seg">
          <button id="fmSimple" class="segbtn on" type="button">簡易</button>
          <button id="fmAdv" class="segbtn" type="button">詳細</button>
        </span>
      </div>

      <div id="filterSimple">
        <label class="lbl row" for="topPct">
          <span>上位 (色・太さの属性で)</span><span id="topPctVal" class="num">100%</span>
        </label>
        <input type="range" id="topPct" min="5" max="100" step="5" value="100">
        <div id="simpleHist" class="histbox"></div>
        <div id="simpleHistInfo" class="cinfo"></div>
      </div>

      <div id="filterAdv" hidden>
        <div class="lbl row">
          <span>条件の結合</span>
          <span class="seg">
            <button id="cbAnd" class="segbtn on" type="button">AND</button>
            <button id="cbOr" class="segbtn" type="button">OR</button>
          </span>
        </div>
        <div id="conds"></div>
        <div class="btnrow">
          <button id="addCond" type="button">＋ 条件を追加</button>
          <button id="clearCond" type="button" class="mini">全削除</button>
        </div>
        <div id="filterStat" class="info"></div>
      </div>

      <div id="edgeLegend" class="legend"></div>
    </section>

    <section>
      <label class="lbl" for="search">ノード検索</label>
      <input type="search" id="search" placeholder="遺伝子名 (部分一致)" autocomplete="off">
      <ul id="searchResults" class="results"></ul>
    </section>

    <section id="selectionBox" hidden>
      <div class="lbl row"><span>選択したノード</span>
        <button id="clearSel" class="mini">解除</button></div>
      <div id="selection"></div>
    </section>

    <section>
      <div class="lbl">表示</div>
      <div class="toggles">
        <label><input type="checkbox" id="tgLabels" checked> ラベル</label>
        <label><input type="checkbox" id="tgArrows" checked> 矢印</label>
        <label><input type="checkbox" id="tgCurved" checked> 曲線</label>
        <label><input type="checkbox" id="tgTargets" checked> 注目遺伝子を強調</label>
      </div>
      <label class="lbl row" for="labelCount">
        <span>ラベル数 (次数上位)</span><span id="labelCountVal" class="num">25</span>
      </label>
      <input type="range" id="labelCount" min="0" max="120" step="5" value="25">
    </section>

    <section>
      <div class="lbl">レイアウト</div>
      <div class="btnrow">
        <button id="btnPause">一時停止</button>
        <button id="btnFit">全体表示</button>
        <button id="btnRestart">再配置</button>
      </div>
      <label class="lbl row" for="repulsion">
        <span>反発</span><span id="repulsionVal" class="num">1.0</span>
      </label>
      <input type="range" id="repulsion" min="0.1" max="3" step="0.1" value="1.0">
      <label class="lbl row" for="linkDist">
        <span>エッジ長</span><span id="linkDistVal" class="num">20</span>
      </label>
      <input type="range" id="linkDist" min="2" max="80" step="1" value="20">
    </section>

    <section class="nodeLegend">
      <div class="lbl">ノード</div>
      <div class="legend">
        <span><i class="dot src"></i>親のみ (source)</span>
        <span><i class="dot mid"></i>中間</span>
        <span><i class="dot sink"></i>子のみ (sink)</span>
        <span><i class="dot tgt"></i>注目遺伝子</span>
      </div>
      <p class="note">大きさ = 次数。矢印は「親 → 子」。向きはマルコフ同値類の中で
      決まらないことがあるので、因果の主張として読まないこと。</p>
    </section>

    <section id="files" class="files"></section>
  </aside>

  <main id="stage">
    <div id="graph"></div>
    <div id="labels"></div>
    <div id="tooltip" hidden></div>
    <div id="hud"></div>
    <div id="loading">読み込み中…</div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
